[package]
name = "coffer-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loopback HTTP server for the Shelf. Every Coffer surface talks to this."

[dependencies]
coffer-core = { path = "../coffer-core" }
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["native-tls", "charset", "gzip", "brotli"] }
zip = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
sha2 = "0.10"
ed25519-dalek = "2"
native-tls = "0.2"

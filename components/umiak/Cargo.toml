[workspace]
resolver = "2"
members = ["crates/zim-ffi", "crates/umiak-core", "crates/umiak-server"]
# The Tauri shell under app/ carries its own workspace so the core builds
# on machines without webview development libraries.
exclude = ["app/src-tauri"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
version = "0.1.0"
